services:
  app:
    build:
      context: ./test
      dockerfile: Dockerfile

    container_name: testrepo-app
    restart: unless-stopped

    env_file:
      - ./test/.env

    environment:
      NODE_ENV: production

    depends_on:
      - db

    labels:
      - traefik.enable=true
      - traefik.http.routers.testrepo.rule=Host(`api.nextgenwilliam.tech`)
      - traefik.http.routers.testrepo.entrypoints=websecure
      - traefik.http.routers.testrepo.tls.certresolver=letsencrypt
      - traefik.http.services.testrepo.loadbalancer.server.port=80

    networks:
      - testrepo_default

  db:
    image: mariadb:11.4
    container_name: myapp-db
    restart: unless-stopped

    env_file:
      - ./test/.env

    volumes:
      - database_data:/var/lib/mysql

    networks:
      - testrepo_default

  admin:
    image: phpmyadmin:5.2-apache
    container_name: myapp-admin
    restart: unless-stopped

    depends_on:
      - db

    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M

    labels:
      - traefik.enable=true
      - traefik.http.routers.admin.rule=Host(`db.nextgenwilliam.tech`)
      - traefik.http.routers.admin.entrypoints=websecure
      - traefik.http.routers.admin.tls.certresolver=letsencrypt
      - traefik.http.services.admin.loadbalancer.server.port=80

    networks:
      - testrepo_default

volumes:
  database_data:

networks:
  testrepo_default:
    external: true